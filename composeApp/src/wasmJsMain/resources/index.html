<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMP Example</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #fff; }
        canvas#ComposeTarget {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<!-- Compose renders into this canvas element -->
<canvas id="ComposeTarget"></canvas>
<!-- Skiko: Skia-based rendering engine for Compose on the web -->
<script src="skiko.js" defer></script>
<!-- Compiled Kotlin/Wasm entry point -->
<script src="composeApp.js" defer></script>
</body>
</html>
